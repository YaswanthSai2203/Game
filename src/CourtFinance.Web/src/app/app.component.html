<div class="shell">

      <div>
        <div class="title">{{ title }}</div>
        <div class="subtitle">Appropriations, funds, and court disbursements</div>
      </div>
    </div>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>

    </nav>
  </header>
  <main class="main">

</div>
